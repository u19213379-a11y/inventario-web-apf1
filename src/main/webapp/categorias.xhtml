<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core" xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    template="/WEB-INF/plantillas/layout.xhtml">
    <ui:define name="titulo">Categorías</ui:define>
    <ui:define name="contenido">
      <div class="eyebrow">Administración</div><h1 class="page-title">Categorías</h1><p class="lead-sub">Organiza el catálogo por familias de productos.</p>
      <h:messages globalOnly="true" styleClass="alert alert-light border" />
      <div class="row g-4"><div class="col-lg-5"><div class="card surface-card"><div class="card-body p-4"><h2 class="h5 fw-bold mb-3">Nueva categoría</h2>
        <h:form id="formCategoria"><div class="mb-3"><h:outputLabel for="nombre" value="Nombre *" styleClass="form-label" /><h:inputText id="nombre" value="#{categoriaBean.nueva.nombre}" required="true" styleClass="form-control" /><h:message for="nombre" styleClass="text-danger small" /></div>
        <div class="mb-3"><h:outputLabel for="descripcion" value="Descripción" styleClass="form-label" /><h:inputTextarea id="descripcion" value="#{categoriaBean.nueva.descripcion}" rows="3" styleClass="form-control" /></div>
        <h:commandButton value="Guardar categoría" action="#{categoriaBean.registrar}" styleClass="btn btn-primary w-100" /></h:form>
      </div></div></div><div class="col-lg-7"><div class="card surface-card"><div class="card-body p-4"><h2 class="h5 fw-bold mb-3">Categorías registradas</h2><h:dataTable value="#{categoriaBean.categorias}" var="c" styleClass="table table-hover"><h:column><f:facet name="header">Categoría</f:facet>#{c.nombre}</h:column><h:column><f:facet name="header">Descripción</f:facet>#{c.descripcion}</h:column></h:dataTable></div></div></div></div>
    </ui:define>
</ui:composition>
