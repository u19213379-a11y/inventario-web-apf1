<!DOCTYPE html>
<html lang="es" xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets">
<h:head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title><ui:insert name="titulo">Inventario</ui:insert> | Nova Lima</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <h:outputStylesheet library="css" name="nova.css" />
</h:head>
<h:body>
    <nav class="navbar navbar-expand-lg navbar-dark main-nav shadow-sm">
      <div class="container-fluid page-width">
        <h:link outcome="/dashboard" styleClass="navbar-brand fw-bold d-flex align-items-center gap-2">
          <span class="brand-icon">N</span><span>Nova Lima <small class="fw-normal brand-sub">/ Inventario</small></span>
        </h:link>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNova" aria-controls="navbarNova" aria-expanded="false" aria-label="Mostrar menú"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="navbarNova">
          <ul class="navbar-nav ms-lg-4 me-auto gap-lg-2">
            <li class="nav-item"><h:link outcome="/dashboard" value="Resumen" styleClass="nav-link" /></li>
            <li class="nav-item"><h:link outcome="/productos" value="Productos" styleClass="nav-link" /></li>
            <li class="nav-item"><h:link outcome="/movimientos" value="Movimientos" styleClass="nav-link" /></li>
            <li class="nav-item"><h:link outcome="/reporte-stock" value="Stock bajo" styleClass="nav-link" /></li>
            <li class="nav-item"><h:link outcome="/categorias" value="Categorías" styleClass="nav-link" rendered="#{sesionBean.admin}" /></li>
          </ul>
          <div class="d-flex align-items-center gap-3 text-white-50 nav-user">
             <h:outputText value="#{sesionBean.usuario.nombres}" />
             <h:form styleClass="m-0"><h:commandLink value="Salir" action="#{sesionBean.cerrarSesion}" styleClass="btn btn-outline-light btn-sm px-3" /></h:form>
          </div>
        </div>
      </div>
    </nav>
    <main class="container-fluid page-width py-4 py-lg-5">
        <ui:insert name="contenido" />
    </main>
    <footer class="page-width px-3 pb-4 footer-note">Nova Lima · Control de inventario | APF2 · Desarrollo Web Integrado</footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</h:body>
</html>
